name: Build Release

on:
  push:
    tags:
      - 'v*' # Сборка запускается при пуше тега v1.0, v2.0 и т.д.
  workflow_dispatch:

jobs:
  build:
    name: Build GUI EXE
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install requests pyinstaller
        
    - name: Build EXE (Windowed)
      run: |
        # --noconsole убирает черное окно
        # --onefile делает один exe
        pyinstaller --noconsole --onefile --name "BonelabModLoader" src/client.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: BonelabModLoader
        path: dist/BonelabModLoader.exe

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/BonelabModLoader.exe