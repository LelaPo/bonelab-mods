name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (GUI)
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --name "BonelabModLoader" src/client.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonelabModLoader
          path: dist/BonelabModLoader.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BonelabModLoader.exe