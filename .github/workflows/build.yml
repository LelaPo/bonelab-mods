name: Build Release

on:
  push:
    tags:
      - 'v*' # Сборка запускается только при создании тега (например v1.0)
  workflow_dispatch: # Или ручной запуск

jobs:
  build:
    name: Build EXE
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build EXE
      run: |
        pyinstaller --onefile --name "BonelabModLoader" --icon=NONE src/client.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: BonelabModLoader
        path: dist/BonelabModLoader.exe

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/BonelabModLoader.exe