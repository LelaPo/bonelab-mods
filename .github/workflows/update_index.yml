name: Auto-Generate Profiles Index

on:
  push:
    paths:
      - 'profiles/*.json'      # Триггер только при смене профилей
      - '!profiles/index.json' # Игнорируем сам индекс, чтобы не зациклить
    branches: [ main ]

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: разрешение на запись в репо

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Generator Script
        run: python tools/gen_profiles_index.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Auto-update profiles/index.json"
          file_pattern: profiles/index.json